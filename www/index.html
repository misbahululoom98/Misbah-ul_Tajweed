<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نور التجوید انٹرایکٹو ایڈیشن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <!-- Chosen Palette: Emerald & Gold Spiritual Theme -->
    <!-- Application Structure Plan: 
        The app is designed as a Comprehensive Educational SPA. 
        1. Navigation: Sidebar for lesson access and Bottom bar for main utility modules.
        2. Dashboard: Using Chart.js to visualize phonetic distributions (Halki, Shafwi, etc.) for better classification understanding.
        3. 3D Interactive Map: SVG-based vocal tract with Web Speech API for real-time pronunciation teaching.
        4. Lessons: Expanded to 15 chapters covering advanced topics like Idgham types and Waqf symbols.
        5. State Management: Simple JS objects to handle bookmarks, quiz progress, and lesson navigation.
        This structure was chosen to provide a non-linear, exploratory learning experience that goes beyond simple reading.
    -->
    <!-- Visualization & Content Choices: 
        - Phonetic Distribution -> Goal: Organize/Analyze -> Chart.js Pie Chart -> Interaction: Hover to see percentages -> Justification: Helps students visualize the variety of exit points.
        - Vocal Tract -> Goal: Inform/Locate -> Interactive SVG -> Interaction: Click to hear sound -> Justification: Direct mapping of theory to auditory feedback.
        - Quiz -> Goal: Assess -> Dynamic HTML Forms -> Interaction: Real-time feedback -> Justification: Active learning reinforcement.
        - NO SVG/Mermaid used for diagrams other than the manual SVG map.
    -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <style>
        :root {
            --primary: #065f46;
            --primary-light: #ecfdf5;
            --accent: #b45309;
            --bg-soft: #f8fafc;
            --text-main: #1e293b;
        }
        body {
            font-family: 'Noto Nastaliq Urdu', serif;
            background-color: var(--bg-soft);
            color: var(--text-main);
            transition: background 0.3s;
        }
        .urdu-text { font-family: 'Noto Nastaliq Urdu', serif; line-height: 2.2; }
        .arabic-quran { font-family: 'Amiri', serif; font-size: 1.3rem; color: #047857; direction: ltr; display: inline-block; }
        .chart-container { position: relative; width: 100%; max-width: 500px; margin: auto; height: 300px; }
        .nav-active { color: var(--primary); border-bottom: 3px solid var(--primary); }
        .lesson-card { transition: transform 0.2s; border-right: 4px solid transparent; }
        .lesson-card:hover { transform: translateX(-5px); border-right-color: var(--primary); }
        .interactive-part { cursor: pointer; transition: 0.3s; }
        .interactive-part:hover { fill-opacity: 0.8; stroke-width: 3px; }
        @media (max-width: 640px) {
            .arabic-quran { font-size: 1.1rem; }
            .chart-container { height: 250px; }
        }
    </style>
</head>
<body class="pb-20 overflow-x-hidden">

    <!-- Header -->
    <header class="bg-emerald-900 text-white p-4 shadow-lg sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <button onclick="toggleMenu()" class="text-2xl p-2 bg-emerald-800 rounded-lg">☰</button>
            <h1 class="text-xl font-bold urdu-text">نور التجوید: ڈیجیٹل ایڈیشن</h1>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleTheme()" class="p-2 bg-emerald-800 rounded-full">🌙</button>
            <button onclick="showSearch()" class="p-2 bg-emerald-800 rounded-full">🔍</button>
        </div>
    </header>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl z-[60] transform translate-x-full transition-transform duration-300 overflow-y-auto">
        <div class="p-4 bg-emerald-50 border-b flex justify-between items-center">
            <span class="font-bold text-emerald-900">فہرستِ اسباق (مکمل)</span>
            <button onclick="toggleMenu()" class="text-gray-500">✕</button>
        </div>
        <nav id="lessonList" class="p-2 space-y-1"></nav>
    </aside>
    <div id="overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/40 z-[55] hidden"></div>

    <!-- Main Content -->
    <main id="app-container" class="max-w-4xl mx-auto p-4 md:p-8">
        <!-- Content will be injected here -->
        <div id="view-home" class="space-y-6">
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-emerald-100 text-center">
                <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="text-3xl">📖</span>
                </div>
                <h2 class="text-3xl font-bold text-emerald-900 mb-2">تجویدِ قرآن کا جامع نصاب</h2>
                <p class="text-slate-500 urdu-text">قرآن مجید کو اس کے صحیح مخارج اور صفات کے ساتھ پڑھنے کی مکمل گائیڈ۔</p>
                <button onclick="loadLesson(1)" class="mt-6 bg-emerald-700 text-white px-8 py-3 rounded-full font-bold shadow-lg hover:bg-emerald-800 transition">پڑھنا شروع کریں</button>
            </div>
            
            <div class="grid md:grid-cols-2 gap-4">
                <div onclick="switchTab('map')" class="bg-emerald-50 p-6 rounded-2xl cursor-pointer hover:bg-emerald-100 transition border border-emerald-200">
                    <h3 class="font-bold text-emerald-800 text-lg">🗺️ انٹرایکٹو مخارج نقشہ</h3>
                    <p class="text-sm text-emerald-600 mt-1">منہ اور حلق کے اعضاء سے حروف کی ادائیگی سیکھیں۔</p>
                </div>
                <div onclick="switchTab('stats')" class="bg-amber-50 p-6 rounded-2xl cursor-pointer hover:bg-amber-100 transition border border-amber-200">
                    <h3 class="font-bold text-amber-800 text-lg">📊 حروف کا تجزیہ</h3>
                    <p class="text-sm text-amber-600 mt-1">تجویدی حروف کی درجہ بندی اور اعداد و شمار۔</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 flex justify-around p-2 z-40 shadow-up">
        <button onclick="switchTab('home')" class="flex flex-col items-center p-2 text-xs text-slate-500 nav-btn" id="btn-home">
            <span class="text-xl">🏠</span>
            <span class="mt-1">ہوم</span>
        </button>
        <button onclick="switchTab('map')" class="flex flex-col items-center p-2 text-xs text-slate-500 nav-btn" id="btn-map">
            <span class="text-xl">🗺️</span>
            <span class="mt-1">نقشہ</span>
        </button>
        <button onclick="switchTab('quiz')" class="flex flex-col items-center p-2 text-xs text-slate-500 nav-btn" id="btn-quiz">
            <span class="text-xl">📝</span>
            <span class="mt-1">ٹیسٹ</span>
        </button>
        <button onclick="switchTab('stats')" class="flex flex-col items-center p-2 text-xs text-slate-500 nav-btn" id="btn-stats">
            <span class="text-xl">📊</span>
            <span class="mt-1">اعداد و شمار</span>
        </button>
    </nav>

    <!-- Search Modal -->
    <div id="searchModal" class="fixed inset-0 bg-white z-[100] hidden flex flex-col p-4">
        <div class="flex items-center gap-4 mb-4">
            <button onclick="hideSearch()" class="text-2xl">←</button>
            <input type="text" id="searchInput" oninput="performSearch()" placeholder="کچھ تلاش کریں..." class="flex-1 bg-slate-100 p-3 rounded-xl outline-none urdu-text">
        </div>
        <div id="searchResults" class="overflow-y-auto flex-1 space-y-3"></div>
    </div>

    <script>
        const lessons = [
            { id: 1, title: "تعارفِ علمِ تجوید", subtitle: "تجوید کی اہمیت اور تعریف", content: "تجوید وہ علم ہے جس کے ذریعے قرآن مجید کے حروف کو ان کے صحیح مخرج اور صفات کے ساتھ ادا کیا جاتا ہے۔ اس کا موضوع کلماتِ قرآنیہ ہیں اور غرض قرآن کو غلطیوں سے پاک پڑھنا ہے۔ <div class='bg-emerald-50 p-4 rounded-xl mt-4 border-r-4 border-emerald-500'><b class='text-emerald-800'>یاد رکھیں:</b> قرآن کو تجوید سے پڑھنا واجب ہے، اور اس میں غلطی (لحن) کرنا گناہ کا باعث بن سکتا ہے۔</div>" },
            { id: 2, title: "مخارجِ حروف (حصہ اول)", subtitle: "حلق سے ادا ہونے والے حروف", content: "مخارج کی کل تعداد 17 ہے۔ حلق سے 6 حروف ادا ہوتے ہیں جنہیں حروفِ حلقیہ کہا جاتا ہے۔<br><ul class='list-disc pr-6 space-y-2 mt-2'><li><b>اقصیٰ حلق:</b> ہمزہ اور ہا (ء، ہ)۔</li><li><b>وسطِ حلق:</b> عین اور حا (ع، ح)۔</li><li><b>ادنیٰ حلق:</b> غین اور خا (غ، خ)۔</li></ul>" },
            { id: 3, title: "مخارجِ حروف (حصہ دوم)", subtitle: "زبان کے مخارج", content: "زبان سے 18 حروف ادا ہوتے ہیں۔ <br><b>قاف (ق):</b> زبان کی جڑ جب اوپر کے تالو سے لگے۔<br><b>کاف (ک):</b> زبان کی جڑ سے کچھ ہٹ کر منہ کی جانب۔<br><b>ج، ش، ی:</b> زبان کا درمیان جب تالو سے لگے۔" },
            { id: 4, title: "صفاتِ لازمہ متضادہ", subtitle: "حروف کی اندرونی کیفیات", content: "صفات دو قسم کی ہوتی ہیں: لازمہ اور عارضہ۔ صفاتِ متضادہ وہ ہیں جن کی ضد موجود ہو۔ جیسے جہر (آواز کا رکنا) کی ضد ہمس (آواز کا جاری رہنا) ہے۔" },
            { id: 5, title: "نون ساکن اور تنوین", subtitle: "اظہار، ادغام، اقلاب، اخفاء", content: "نون ساکن اور تنوین کے 4 قواعد ہیں:<br><b>اظہار:</b> حروفِ حلقی آنے پر صاف پڑھنا۔<br><b>ادغام:</b> 'یرملون' آنے پر ملا کر پڑھنا۔<br><b>اقلاب:</b> 'ب' آنے پر میم سے بدلنا۔<br><b>اخفاء:</b> آواز کو ناک میں چھپانا۔" },
            { id: 6, title: "میم ساکن کے قواعد", subtitle: "اخفاء، ادغام اور اظہارِ شفوی", content: "میم ساکن کے بعد اگر 'ب' آئے تو اخفاء شفوی، 'م' آئے تو ادغامِ شفوی، اور باقی حروف پر اظہارِ شفوی ہوگا۔" },
            { id: 7, title: "را (ر) کے قواعد", subtitle: "پُر اور باریک پڑھنے کی صورتیں", content: "اگر 'ر' پر زبر یا پیش ہو تو وہ پُر (موٹی) پڑھی جائے گی، اور اگر زیر ہو تو باریک پڑھی جائے گی۔ ساکن ہونے کی صورت میں ماقبل حرکت دیکھی جائے گی۔" },
            { id: 8, title: "مد کے اقسام", subtitle: "مدِ متصل، منفصل اور لازم", content: "حرفِ مد کے بعد ہمزہ یا سکون ہو تو آواز کو لمبا کیا جاتا ہے۔ مدِ متصل (اسی کلمہ میں ہمزہ) کو 4-5 الف تک لمبا کرنا واجب ہے۔" },
            { id: 9, title: "لامِ تعریف کے قواعد", subtitle: "حروفِ قمریہ اور شمسیہ", content: "اگر 'ال' کے بعد حروفِ قمریہ (ابغ حجک وخف عقیمہ) ہوں تو لام پڑھا جائے گا، ورنہ شمسی حروف میں لام مدغم ہو جائے گا۔" },
            { id: 10, title: "وقف کے علامات", subtitle: "رکنے اور نہ رکنے کے نشانات", content: "قرآن میں 'ط' کا مطلب وقفِ مطلق، 'ج' وقفِ جائز، اور 'لا' کا مطلب ہے کہ نہ رکا جائے۔" },
            { id: 11, title: "قلقلہ کا بیان", subtitle: "حروفِ 'قطب جد' کی آواز", content: "ق، ط، ب، ج، د جب ساکن ہوں تو ان کی آواز لوٹتی ہوئی محسوس ہوتی ہے جیسے گیند دیوار سے ٹکرا کر واپس آتی ہے۔" },
            { id: 12, title: "ادغام کی باریکیاں", subtitle: "مثلین، متقاربین، متجانسین", content: "دو ایک جیسے حروف یا قریب المخرج حروف کے ملنے کی 3 صورتیں ہیں۔ مثلین (ب+ب)، متجانسین (ت+ط) اور متقاربین (ل+ر)۔" },
            { id: 13, title: "نون و میم مشدد", subtitle: "غنہ کرنے کا وجوب", content: "جس نون یا میم پر تشدید (ّ) ہو، اس پر ہمیشہ ایک الف کی مقدار غنہ (ناک میں آواز لے جانا) کرنا واجب ہے۔" },
            { id: 14, title: "رموزِ اوقافِ جدید", subtitle: "آیت کے درمیان وقف کے نئے نشانات", content: "موجودہ مصاحف میں وقف کی علامات قاری کی سہولت کے لیے لگائی گئی ہیں تاکہ معنی میں فساد پیدا نہ ہو۔" },
            { id: 15, title: "لحنِ جلی و خفی", subtitle: "تلاوت کی بڑی اور چھوٹی غلطیاں", content: "لحنِ جلی (حرف بدلنا) حرام ہے، جبکہ لحنِ خفی (تجوید کے عارضی قواعد چھوڑنا) مکروہ ہے۔" }
        ];

        let currentTab = 'home';
        let isDarkMode = false;

        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function switchTab(tab) {
            currentTab = tab;
            const container = document.getElementById('app-container');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-active'));
            document.getElementById('btn-' + tab).classList.add('nav-active');

            if (tab === 'home') {
                renderHome();
            } else if (tab === 'map') {
                renderMap();
            } else if (tab === 'quiz') {
                renderQuiz();
            } else if (tab === 'stats') {
                renderStats();
            }
        }

        function renderHome() {
            document.getElementById('app-container').innerHTML = `
                <div class="space-y-6">
                    <div class="bg-white p-8 rounded-3xl shadow-sm border border-emerald-100 text-center">
                        <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4"><span class="text-3xl">📖</span></div>
                        <h2 class="text-3xl font-bold text-emerald-900 mb-2 urdu-text">نور التجوید: ڈیجیٹل ایڈیشن</h2>
                        <p class="text-slate-500 urdu-text">قرآن مجید کو اس کے صحیح مخارج اور صفات کے ساتھ پڑھنے کی مکمل گائیڈ۔</p>
                        <button onclick="loadLesson(1)" class="mt-6 bg-emerald-700 text-white px-8 py-3 rounded-full font-bold shadow-lg hover:bg-emerald-800 transition urdu-text">پڑھنا شروع کریں</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="homeLessons"></div>
                </div>
            `;
            const grid = document.getElementById('homeLessons');
            lessons.slice(0, 4).forEach(l => {
                grid.innerHTML += `
                    <div onclick="loadLesson(${l.id})" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 cursor-pointer hover:shadow-md transition flex gap-4 items-center">
                        <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center text-emerald-700 font-bold">${l.id}</div>
                        <div>
                            <h4 class="font-bold text-slate-800 urdu-text">${l.title}</h4>
                            <p class="text-xs text-slate-400 urdu-text">${l.subtitle}</p>
                        </div>
                    </div>
                `;
            });
        }

        function loadLesson(id) {
            const lesson = lessons.find(l => l.id === id);
            document.getElementById('app-container').innerHTML = `
                <div class="bg-white p-6 md:p-10 rounded-3xl shadow-sm border border-slate-100 animate-fade-in">
                    <button onclick="switchTab('home')" class="text-emerald-600 mb-4 flex items-center gap-2">← واپس ہوم</button>
                    <span class="text-emerald-500 font-bold">سبق نمبر ${lesson.id}</span>
                    <h2 class="text-2xl md:text-3xl font-bold text-slate-800 mb-4 urdu-text">${lesson.title}</h2>
                    <p class="text-lg text-emerald-700 mb-6 font-semibold urdu-text">${lesson.subtitle}</p>
                    <div class="prose prose-emerald max-w-none urdu-text text-slate-600 leading-relaxed">
                        ${lesson.content}
                    </div>
                    <div class="mt-10 pt-6 border-t flex justify-between">
                        ${id > 1 ? `<button onclick="loadLesson(${id-1})" class="bg-slate-100 px-4 py-2 rounded-lg text-slate-600">پچھلا سبق</button>` : '<div></div>'}
                        ${id < lessons.length ? `<button onclick="loadLesson(${id+1})" class="bg-emerald-600 text-white px-4 py-2 rounded-lg">اگلا سبق</button>` : '<div></div>'}
                    </div>
                </div>
            `;
            window.scrollTo(0,0);
        }

        function renderMap() {
            document.getElementById('app-container').innerHTML = `
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                    <h2 class="text-2xl font-bold text-emerald-900 mb-2 urdu-text text-center">انٹرایکٹو صوتی نقشہ</h2>
                    <p class="text-center text-slate-400 mb-8 urdu-text">عضو پر کلک کریں اور صوتی ادائیگی سنیں</p>
                    
                    <div class="flex justify-center mb-8">
                        <svg viewBox="0 0 400 400" class="w-full max-w-xs md:max-w-md">
                            <!-- Throat -->
                            <path onclick="playSpeech('أ، ه، ع، ح، غ، خ')" class="interactive-part fill-indigo-100 stroke-indigo-500" d="M 280,250 C 290,280 295,310 290,340 C 270,340 250,310 255,280 Z" />
                            <text x="260" y="310" class="text-[12px] fill-indigo-600 font-bold arabic-quran">الحلق</text>
                            
                            <!-- Tongue -->
                            <path onclick="playSpeech('ق، ک، ج، ش، ی')" class="interactive-part fill-rose-100 stroke-rose-500" d="M 200,240 Q 240,245 270,260 Q 260,280 220,280 Q 180,280 200,240 Z" />
                            <text x="220" y="270" class="text-[12px] fill-rose-600 font-bold arabic-quran">اللسان</text>
                            
                            <!-- Lips -->
                            <circle onclick="playSpeech('ب، م، و، ف')" cx="157" cy="218" r="15" class="interactive-part fill-sky-100 stroke-sky-500" />
                            <text x="120" y="222" class="text-[12px] fill-sky-600 font-bold arabic-quran">الشفتان</text>
                            
                            <!-- Nose -->
                            <path onclick="playSpeech('الغنة')" class="interactive-part fill-emerald-100 stroke-emerald-500" d="M 190,120 Q 230,90 290,130 Q 320,150 310,180 Z" />
                            <text x="240" y="140" class="text-[12px] fill-emerald-600 font-bold arabic-quran">الخیشوم</text>
                        </svg>
                    </div>
                    <div class="bg-emerald-50 p-4 rounded-xl text-center text-sm text-emerald-800 urdu-text">
                        <b>نوٹ:</b> آواز سننے کے لیے انٹرنیٹ اور براؤزر کا صوتی انجن (Text-to-Speech) فعال ہونا ضروری ہے۔
                    </div>
                </div>
            `;
        }

        function playSpeech(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            window.speechSynthesis.speak(utterance);
        }

        function renderStats() {
            document.getElementById('app-container').innerHTML = `
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-8">
                    <h2 class="text-2xl font-bold text-emerald-900 text-center urdu-text">حروف کی درجہ بندی اور تجزیہ</h2>
                    
                    <div class="grid md:grid-cols-2 gap-8 items-center">
                        <div class="chart-container">
                            <canvas id="tajweedChart"></canvas>
                        </div>
                        <div class="space-y-4">
                            <h3 class="font-bold text-slate-800 urdu-text">اہم نکات:</h3>
                            <ul class="space-y-2 text-sm text-slate-600 urdu-text">
                                <li class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-emerald-500"></span> <b>حلقی حروف:</b> تعداد 6 (ء، ہ، ع، ح، غ، خ)</li>
                                <li class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-rose-500"></span> <b>لسانی حروف:</b> تعداد 18 (زبان سے ادا ہونے والے)</li>
                                <li class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-sky-500"></span> <b>شفوی حروف:</b> تعداد 4 (ب، م، و، ف)</li>
                                <li class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-amber-500"></span> <b>مدی حروف:</b> تعداد 3 (ا، و، ی)</li>
                            </ul>
                        </div>
                    </div>
                    <div class="p-6 bg-slate-50 rounded-2xl border border-slate-100">
                        <p class="text-sm text-slate-500 leading-relaxed urdu-text">
                            یہ چارٹ انفرادی حروف کے مجموعی مخارج کی تقسیم ظاہر کرتا ہے۔ اس سے یہ سمجھنے میں مدد ملتی ہے کہ قرآن کریم کی تلاوت میں زبان (لسان) کا کردار سب سے زیادہ یعنی تقریباً 60 فیصد ہوتا ہے۔
                        </p>
                    </div>
                </div>
            `;

            setTimeout(() => {
                const ctx = document.getElementById('tajweedChart').getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['لسانی (18)', 'حلقی (6)', 'شفوی (4)', 'مدی (3)'],
                        datasets: [{
                            data: [18, 6, 4, 3],
                            backgroundColor: ['#f43f5e', '#10b981', '#0ea5e9', '#f59e0b'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { position: 'bottom' } }
                    }
                });
            }, 100);
        }

        function renderQuiz() {
            const q = { q: "حروفِ قلقلہ کی کل تعداد کتنی ہے؟", options: ["3", "5", "7", "9"], correct: 1 };
            document.getElementById('app-container').innerHTML = `
                <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 max-w-lg mx-auto">
                    <h2 class="text-xl font-bold text-center mb-6 urdu-text">تجوید ٹیسٹ</h2>
                    <div class="space-y-4">
                        <p class="font-bold text-slate-700 urdu-text">${q.q}</p>
                        <div class="grid grid-cols-1 gap-2">
                            ${q.options.map((opt, i) => `
                                <button onclick="checkAnswer(${i === q.correct})" class="p-3 text-right border rounded-xl hover:bg-emerald-50 transition urdu-text">${opt}</button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function checkAnswer(isCorrect) {
            alert(isCorrect ? "ماشاءاللہ! درست جواب۔" : "افسوس! غلط جواب، دوبارہ کوشش کریں۔");
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.style.backgroundColor = isDarkMode ? '#0f172a' : '#f8fafc';
            document.body.style.color = isDarkMode ? '#f8fafc' : '#1e293b';
        }

        function showSearch() { document.getElementById('searchModal').classList.remove('hidden'); document.getElementById('searchInput').focus(); }
        function hideSearch() { document.getElementById('searchModal').classList.add('hidden'); }

        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const results = document.getElementById('searchResults');
            results.innerHTML = '';
            if (query.length < 2) return;

            lessons.filter(l => l.title.includes(query) || l.content.includes(query)).forEach(l => {
                results.innerHTML += `
                    <div onclick="loadLesson(${l.id}); hideSearch();" class="p-4 bg-slate-50 rounded-xl cursor-pointer">
                        <h4 class="font-bold urdu-text">${l.title}</h4>
                        <p class="text-xs text-slate-500 urdu-text">${l.subtitle}</p>
                    </div>
                `;
            });
        }

        // Initialize
        (function init() {
            const list = document.getElementById('lessonList');
            lessons.forEach(l => {
                list.innerHTML += `
                    <button onclick="loadLesson(${l.id}); toggleMenu();" class="w-full text-right p-3 hover:bg-emerald-50 rounded-xl transition flex items-center gap-3">
                        <span class="w-8 h-8 bg-emerald-100 text-emerald-700 rounded-lg flex items-center justify-center text-xs font-bold">${l.id}</span>
                        <span class="text-sm urdu-text">${l.title}</span>
                    </button>
                `;
            });
            switchTab('home');
        })();
    </script>
</body>
</html>
